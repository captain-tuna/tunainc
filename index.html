<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Tuna Inc. — Image Centre</title>
    <meta name="description" content="The official Tuna Inc. Image Centre.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0d;
            color: #eee;
        }

        header {
            height: 230px;
            background:
                linear-gradient(to bottom, #0003, #0b0b0d),
                url("banner0.png") center 45% / cover no-repeat;
            border-bottom: 1px solid #29292f;
        }

        .header-inner {
            max-width: 1100px;
            margin: auto;
            padding: 28px 25px;
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .brand span {
            color: #a16bc5;
        }

        main {
            max-width: 1100px;
            margin: 35px auto 70px;
            padding: 0 25px;
        }

        .intro {
            margin-bottom: 30px;
        }

        .intro h1 {
            font-size: 30px;
            font-weight: 500;
            margin: 0 0 10px;
        }

        .intro p {
            color: #99999f;
            font-size: 15px;
            line-height: 1.6;
            max-width: 540px;
            margin: 0;
        }

        .pages {
            display: grid;
            grid-template-columns: repeat(auto-fill, 180px);
            gap: 16px;
        }

        .page {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: flex-end;
            padding: 18px;
            background:

                url("sunsetdesert.png") center / cover no-repeat;

        .page:hover {
            border-color: #8d35c7;

            padding: 22px 25px;
            border-top: 1px solid #29292f;
            color: #66666b;
            font-size: 13px;
        }

        .footer-inner {
            max-width: 1100px;
            margin: auto;
        }

        @media (max-width: 450px) {
            header {
                height: 180px;
            }

                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

</head>
