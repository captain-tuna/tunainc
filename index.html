<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tuna Inc. — Official Image Archive</title>

    <meta name="description" content="Official Tuna Inc. image archive featuring Tuna Inc. logos, departments, projects, facilities and more.">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0d;
            color: white;
        }

        header {
            padding: 50px 20px;
            text-align: center;
            background: #111116;
            border-bottom: 1px solid #29292f;
        }

        h1 {
            margin: 0;
            font-size: 42px;
            letter-spacing: 2px;
        }

        header p {
            color: #aaa;
            font-size: 18px;
        }

        .gallery {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: #15151a;
            border: 1px solid #29292f;
            border-radius: 14px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #8d35c7;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: #ffffff;
            display: block;
        }

        .card h2 {
            font-size: 18px;
            margin: 18px;
        }

        footer {
            text-align: center;
            padding: 40px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>TUNA INC.</h1>
    <p>Official Tuna Inc. Image Archive</p>
</header>

<main class="gallery">

    <div class="card">
        <img src="Tuna%20Inc%20Logo.png"
             alt="Tuna Inc. Logo">
        <h2>Tuna Inc. Logo</h2>
    </div>

    <div class="card">
        <img src="Tuna%20Air%20Logo.png"
             alt="Tuna Air Logo">
        <h2>Tuna Air Logo</h2>
    </div>

    <div class="card">
        <img src="Tuna%20Security%20Logo.png"
             alt="Tuna Security Logo">
        <h2>Tuna Security Logo</h2>
    </div>

    <div class="card">
        <img src="Tuna%20Hazards%20Logo.png"
             alt="Tuna Hazards Logo">
        <h2>Tuna Hazards Logo</h2>
    </div>

    <div class="card">
        <img src="Tuna%20Inc.%20Cafe%20Logo.png"
             alt="Tuna Inc. Cafe Logo">
        <h2>Tuna Inc. Cafe Logo</h2>
    </div>

    <div class="card">
        <img src="T.M.A%20Logo.png"
             alt="Tuna Military Authority Logo">
        <h2>T.M.A. Logo</h2>
    </div>

</main>

<footer>
    © Tuna Inc. — Official Archive
</footer>

</body>
</html>
