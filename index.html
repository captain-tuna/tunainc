
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tuna Inc. Information Centre</title>
    <meta name="description" content="The official Tuna Inc. Information Centre. Browse company logos, branches, ranks and aircraft.">

    <link rel="icon" type="image/x-icon" href="logos%20(6).ico">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Banner */

        .banner {
            width: 100%;
            height: 300px;
            overflow: hidden;
            background: #191919;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;

            -webkit-mask-image: linear-gradient(
                to bottom,
                #000 0%,
                #000 72%,
                transparent 100%
            );

            mask-image: linear-gradient(
                to bottom,
                #000 0%,
                #000 72%,
                transparent 100%
            );
        }

        /* Main content */

        .content {
            min-height: calc(100vh - 300px);
            margin-top: -1px;
            padding: 45px 20px 80px;
            text-align: center;

            background:
                linear-gradient(
                    rgba(12, 12, 12, 0.76),
                    rgba(12, 12, 12, 0.90)
                ),
                url("terrain.PNG") center / cover fixed;
        }

        h1 {
            margin: 0 0 42px;
            font-size: clamp(27px, 4vw, 38px);
            font-weight: 500;
            letter-spacing: -0.8px;
        }

        /* Category links */

        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0;
            max-width: 900px;
            margin: 0 auto;
        }

        .category {
            width: 175px;
            height: 175px;
            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(25, 25, 25, 0.92);
            border: 1px solid #444;

            color: #fff;
            text-decoration: none;
            font-size: 19px;

            transition:
                background 0.2s,
                border-color 0.2s;
        }

        .category:hover {
            background: #303030;
            border-color: #888;
        }

        .category:focus-visible {
            outline: 2px solid #fff;
            outline-offset: -4px;
        }

        /* Footer */

        footer {
            padding: 22px;
            text-align: center;
            color: #777;
            font-size: 12px;
            background: #101010;
            border-top: 1px solid #292929;
        }

        /* Mobile layout */

        @media (max-width: 600px) {
            .banner {
                height: 190px;
            }

            .content {
                min-height: calc(100vh - 190px);
                padding: 35px 15px 55px;
                background-attachment: scroll;
            }

            h1 {
                margin-bottom: 30px;
            }

            .categories {
                max-width: 360px;
            }

            .category {
                width: 50%;
                height: 140px;
                font-size: 17px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .category {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <header class="banner">
        <img src="banner0.PNG" alt="Tuna Inc.">
    </header>

    <main class="content">
        <h1>Tuna Inc. Information Centre</h1>

        <nav class="categories" aria-label="Information centre">
            <a class="category" href="logos.html">Logos</a>
            <a class="category" href="branches.html">Branches</a>
            <a class="category" href="ranks.html">Ranks</a>
            <a class="category" href="aircraft.html">Aircraft</a>
             <a class="category" href="facilities.html">Facilities</a>
                   <a class="category" href="facilities.html">Events</a>
        </nav>
    </main>

    <footer>
        Tuna Inc.
    </footer>

</body>
</html>
