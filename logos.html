
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logos — Tuna Inc. Image Centre</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            padding: 25px 6%;
            border-bottom: 1px solid #303030;
            background: #151515;
        }

        header a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        header a:hover {
            color: #fff;
        }

        main {
            max-width: 1150px;
            margin: auto;
            padding: 35px 24px 65px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
            font-weight: 500;
        }

        .description {
            margin: 0 0 35px;
            color: #999;
            font-size: 14px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .item {
            min-width: 0;
        }

        .image-box {
            height: 220px;
            padding: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1b1b1b;
            border: 1px solid #333;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .item p {
            margin: 12px 0 0;
            color: #ccc;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .image-box {
                height: 170px;
                padding: 15px;
            }
        }

        @media (max-width: 420px) {
            .gallery {
                grid-template-columns: 1fr;
            }

            .image-box {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="index.html">Home</a>
    </header>

    <main>
        <h1>Logos</h1>
        <p class="description">Tuna Inc. and its departments.</p>

        <div class="gallery">

            <div class="item">
                <div class="image-box">
                    <img src="Tuna Inc Logo.png" alt="Tuna Inc. logo">
                </div>
                <p>Tuna Inc.</p>
            </div>

            <div class="item">
                <div class="image-box">
                    <img src="TUNA Logo.png" alt="TUNA logo">
                </div>
                <p>TUNA</p>
            </div>

            <div class="item">
                <div class="image-box">
                    <img src="T.M.A Logo.png" alt="T.M.A logo">
                </div>
                <p>T.M.A.</p>
            </div>

            <div class="item">
                <div class="image-box">
                    <img src="Tuna Air Logo.png" alt="Tuna Air logo">
                </div>
                <p>Tuna Air</p>
            </div>

            <div class="item">
                <div class="image-box">
                    <img src="Tuna Hazards Logo.png" alt="Tuna Hazards logo">
                </div>
                <p>Tuna Hazards</p>
            </div>

            <div class="item">
                <div class="image-box">
                    <img src="Tuna Security Logo.png" alt="Tuna Security logo">
                </div>
                <p>Tuna Security</p>
            </div>

            <div class="item">
                <div class="image-box">
                    <img src="Tuna Inc. Cafe Logo.png" alt="Tuna Inc. Cafe logo">
                </div>
                <p>Tuna Inc. Cafe</p>
            </div>

        </div>
    </main>

</body>
</html>
